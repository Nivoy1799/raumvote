services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: raumvote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raumvote"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    environment:
      - DB_POOL_SIZE=10
    deploy:
      replicas: ${APP_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    environment:
      - DB_POOL_SIZE=5
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.30.1-alpine3.23
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
